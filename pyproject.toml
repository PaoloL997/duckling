[tool.poetry]
name = "duckling"
version = "0.1.0"
description = "Process different document formats using Docling + Custom pipelines"
authors = ["Paolo Litta <plitta@brembanarolle.com>"]
readme = "README.md"
packages = [{ include = "duckling" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.14"

torch = { version = "==2.8.0", source = "pytorch" }
torchvision = { version = "==0.23.0", source = "pytorch" }
torchaudio = { version = "==2.8.0", source = "pytorch" }

docling = ">=2.57.0,<3.0.0"
langchain = ">=1.1.0,<2.0.0"
langchain-openai = ">=1.1.0,<2.0.0"
pymupdf = "^1.26.5"
easyocr = "^1.7.2"
opencv-python = "^4.12.0.88"
matplotlib = "^3.10.8"
langgraph = "^1.0.6"
fastapi = "^0.129.0"
uvicorn = "^0.41.0"
python-multipart = ">=0.0.22,<0.0.23"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.5.0,<5.0.0)",
    "pylint (>=4.0.4,<5.0.0)",
    "mypy (>=1.19.0,<2.0.0)",
    "interrogate (>=1.7.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
]
