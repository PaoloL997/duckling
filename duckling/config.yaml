models:
  llm: gpt-4.1-nano
  draw_llm: gpt-4.1-mini
  tokenizer: sentence-transformers/all-MiniLM-L6-v2

prompts:
  retrive_image_description: |
    You are given the following markdown content extracted from a PDF document.

    Your task is to identify and process images ONLY when they are explicitly defined using the following Markdown syntax:

    ![Image](path/to/image)

    IMPORTANT RULES:
    - Consider an image present ONLY if the exact Markdown pattern `![Image](...)` exists.
    - Ignore any textual references to figures, diagrams, screenshots, or images that are NOT accompanied by this syntax.
    - Do NOT infer images from captions, figure numbers, or descriptive text alone.

    For each valid image found, create a JSON object with the following fields:
    - "path": the full path or URL of the image exactly as it appears inside the parentheses
    - "name": the exact name or identifier used to reference this image in the surrounding text (before or after the image).  
      - If no explicit name or identifier is present, use the image filename (without extension) as the name.
    - "description": a detailed and reasoned explanation of what the image represents, inferred strictly from the surrounding text and its role in the document.

    Additional constraints:
    - Carefully analyze the text immediately before and after each image to determine its correct reference name and purpose.
    - If the same image path appears multiple times, output only one JSON object with a merged and comprehensive description.
    - Do not hallucinate or invent images that are not explicitly present via the Markdown syntax.

    Output format:
    - Return a single valid JSON array.
    - Do not include any additional text outside the JSON.

    Markdown content:
    {markdown_content}

  describe_image: |
    Describe the image in detail. Explain what is visible, including the main subjects, their surroundings, and any relevant actions, 
    objects, or features. Mention colors, composition, and general atmosphere if noticeable. If any measurements, dimensions, scale
    indicators, abbreviations, symbols, numbers, or text appear in the image, include them accurately in the description. Focus on
    providing a clear, precise, and complete account of everything observable in the image.

  image_refinement: |
    The attached image corresponds to the following description: {description}.

    Carefully analyze the image and expand the provided description by including all visible details shown in the image.
    Make sure to cover text, symbols, labels, measurements, numerical values, annotations, and any other relevant visual elements present in the image.
    The resulting description should be comprehensive, precise, and faithful to what is visually observable.

    Return the enhanced description only, without any additional commentary or formatting.

  draw_analysis: |
    Role: You are an expert Technical Document Analyst specialized in engineering blueprints, CAD exports, and architectural plans.
    Task: Provide a high-fidelity, comprehensive, and structured description of the attached technical drawing (File Name: {filename}). This description is specifically designed to serve as a "textual twin" for a RAG (Retrieval-Augmented Generation) system.
    Core Directive (CRITICAL): Your primary goal is exhaustive identification. Do not spend effort extracting precise measurements or dimensions unless they are part of a part name or a critical specification. Instead, focus on identifying every single individual component, sub-assembly, and technical feature present. The more detail you provide about "what" is in the drawing, the higher the probability the RAG system will correctly retrieve this document for a specific query.
    Instructions: Analyze the image meticulously and provide a report covering the following sections:
    Header & Title Block:
      Extract the document title, part/drawing number, author, date, and revision history.
      Identify the organization or project name.
    Primary Subject & Scope:
      Define the main assembly or architectural area shown.
      Identify the drawing type (e.g., exploded view, assembly, schematic, P&ID, layout, section).
      Describe the overall function or purpose of the system depicted.
    Tabular Data & Schedules (MAXIMUM DETAIL):
      Transcribe all tables (Bill of Materials (BOM), Parts List, Revision Tables, Specification Schedules).
      For each table, list every row and column.
      Crucial: Ensure every part name, material, and reference code in the tables is written out clearly to enable text-based search.
    Component & Feature Inventory:
      List every labeled part, callout, and balloon reference.
      Describe the visible features (e.g., "flange with 8 holes," "reinforced concrete beam," "threaded intake valve").
      Note any technical annotations, material callouts, or treatment requirements (e.g., "Powder Coated," "ISO 2768-m").
    Visual Context & Perspectives:
      Describe the views provided (e.g., isometric, top-down, sectional views A-A, detail zooms).
      Explain the spatial relationship between the main components (e.g., "The motor is mounted via a bracket to the main chassis").
    Key Search Terms for RAG:
      Provide a list of 15-20 technical keywords and synonyms found in or relevant to the drawing. Think like an engineer searching a database (e.g., "Hydraulic assembly," "Steel S355," "Assembly sequence").
    Output Style: Use precise, technical terminology. Prioritize a dense, informative recap of the drawing's content over aesthetic formatting.

  organize_draw_description: |
    Role: You are a Senior Technical Documentation Architect.
    Task: You have been provided with multiple individual descriptions of pages belonging to a single technical document (File Name: {filename}). Your goal is to synthesize these descriptions into a single, unified Master Summary that provides a clear overview of the entire project or assembly.
    Input Data: {list_of_page_descriptions}
    Instructions for Synthesis:
      - Global Overview: Start with a high-level summary of what the entire document represents (e.g., "This is a 5-page structural set for a bridge assembly").
      - Logical Flow: Organize the information following the document's logical progression (e.g., from General Layout to specific Component Details or BOM tables)
      - Consolidated Tables & Lists: Merge information from tables found across different pages. If Page 1 has a partial BOM and Page 5 continues it, present a unified summary of the materials and components involved.
      - Cross-Page Relationships: Explain how the pages relate to each other (e.g., "Page 2 provides a sectional view of the assembly shown in the isometric view on Page 1").
      - Technical Consistency: Ensure that part numbers, dimensions, and specifications are cross-referenced accurately. Eliminate redundant descriptions while keeping all unique technical data.
    Final Output Objective: Create a "Searchable Knowledge Base Entry" that allows a RAG system to understand the full scope of the document without reading individual page reports. Focus on technical keywords and functional relationships.
